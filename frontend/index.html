<!DOCTYPE html>
<html>
<head>
  <title>TrustLayer AI</title>
</head>

<body style="font-family: Arial; text-align:center; margin-top:50px;">

  <h1>🛡 TrustLayer AI</h1>

  <input id="input" placeholder="Enter prompt"
    style="padding:10px; width:300px;" />

  <button onclick="run()"
    style="padding:10px;">Analyze</button>

  <p id="out"></p>

  <script>
    async function run() {
      const text = document.getElementById("input").value;

      const res = await fetch("YOUR_CLOUD_RUN_URL/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
      });

      const data = await res.json();

      document.getElementById("out").innerText =
        data.result;
    }
  </script>

</body>
</html>
